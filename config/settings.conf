# Paths are resolved from base_dir.
base_dir=..
schedule_file=config/schedule.csv
state_file=data/state.csv
air_alerts_state_file=data/air_alert_state.conf
log_file=logs/ringmabell.log
lock_file=data/ringmabell.lock

# Linux: auto prefers mpg123 for headless/systemd audio playback.
audio_backend=auto

# Use this only when audio_backend=command.
# Example Linux:
# audio_command=/usr/bin/mpg123 -q -o alsa {file}

poll_interval_ms=500

# If the PC boots shortly after a scheduled bell, RingMaBell will still play it
# within this window. Older missed bells are marked as skipped to avoid ringing
# hours late after a long power outage.
missed_grace_seconds=300
catch_up_missed_bells=true
mark_expired_as_skipped=true

playback_retries=2
retry_delay_seconds=5
require_existing_sound=true

# School bells are muted on Saturday and Sunday.
# Air alerts are not muted because the shelter can be active for citizens.
bell_weekends_enabled=false

# Air alerts for Kyiv through Ubilling Aerial Alerts API.
# No token is required. The monitor reads states["м. Київ"].alertnow.
air_alerts_enabled=true
air_alerts_endpoint=https://ubilling.net.ua/aerialalerts/

# Ubilling caches raw data for about 3 seconds and rate-limits at 2 rps per host.
# Polling every 3 seconds is the fastest useful setting without hammering the API.
air_alerts_poll_seconds=3
air_alerts_http_timeout_seconds=2
air_alerts_notify_active_on_startup=true

air_alert_start_sound=sounds/air-alert-start.mp3
air_alert_end_sound=sounds/air-alert-end.mp3
